apiVersion: apps/v1
kind: Deployment
metadata:
  name: labcare-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labcare-backend
  template:
    metadata:
      labels:
        app: labcare-backend
    spec:
      containers:
        - name: backend
          image: backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: labcare-backend-env
          ports:
            - containerPort: 5000