apiVersion: apps/v1
kind: Deployment
metadata:
  name: labcare-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labcare-frontend
  template:
    metadata:
      labels:
        app: labcare-frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173