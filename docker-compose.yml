services:
  backend:
    build: ./backend
    container_name: labcare-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: labcare-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped